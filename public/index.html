<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgilStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>AgilStore</h1>

    <!-- Formulário para adicionar produtos -->
    <form class="formulario" method="POST" action="/add-product">
        <input
            type="text"
            name="productName"
            placeholder="Nome do Produto"
            class="input-bordas"
            required>
        <input
            type="text"
            name="productCategory"
            placeholder="Categoria"
            class="input-bordas"
            required>
        <input
            type="number"
            name="productPrice"
            placeholder="Preço"
            step="0.01"
            class="input-bordas"
            required>
        <input
            type="number"
            name="productStock"
            placeholder="Quantidade em Estoque"
            class="input-bordas"
            required>
        <button type="submit" class="button-form">Adicionar Produto</button>
    </form>

    <!-- Busca -->
    <div class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="Buscar por nome ou categoria"
            class="input-bordas">
        <button type="button" onclick="searchProduct()" class="button-form borda-inversa">
            Buscar
        </button>
    </div>

    <h2>Produtos em Estoque</h2>

    <!-- Tabela de produtos -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody id="product-list">
            <tr>
                <td colspan="5" style="text-align: center;">Carregando...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // Renderizar produtos na tabela
        function renderProducts(products) {
            const table = document.getElementById("product-list");

            if (!products || products.length === 0) {
                table.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum produto encontrado</td></tr>';
                return;
            }

            table.innerHTML = products.map(product => `
                <tr>
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.stock}</td>
                    <td>R$ ${product.price.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        // Carregar todos os produtos ao abrir a página
        function loadProducts() {
            fetch('/products')
                .then(response => response.json())
                .then(data => renderProducts(data.data))
                .catch(error => {
                    console.error("Erro ao carregar produtos:", error);
                    renderProducts([]);
                });
        }

        // Buscar produtos por termo de busca
        function searchProduct() {
            const query = document.getElementById('searchInput').value.trim();

            if (!query) {
                loadProducts();
                return;
            }

            fetch(`/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => renderProducts(data.data))
                .catch(error => {
                    console.error("Erro na busca:", error);
                    renderProducts([]);
                });
        }

        // Buscar quando digitar Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchProduct();
            }
        });

        // Carregar produtos ao iniciar a página
        loadProducts();
    </script>
</body>
</html>
